name: BOMA Lean — PDCA-001

on:
  push:
    branches:
      - lab/pdca-001
  workflow_dispatch:

jobs:
  check-b001:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Kernel/type check B-001
        run: lean LAB/payloads/lean/B001.lean

      - name: Kernel/type check B-001 atomicity probe
        run: lean LAB/payloads/lean/B001_atomicity_probe.lean
