name: BOMA Q Order Additive Compatibility — V5

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LAB/payloads/lean/QStage/QOrderAdditiveCompatibility.lean'
      - '.github/workflows/boma-q-order-additive-compat-001.yml'
      - 'lean-toolchain'

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify additive order compatibility
        id: laws
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat \
            LAB/payloads/lean/NCore/NCoreRB001.lean \
            LAB/payloads/lean/NArithmetic/AddRight.lean \
            LAB/payloads/lean/NArithmetic/AddLeft.lean \
            LAB/payloads/lean/NArithmetic/AddConvergence.lean \
            LAB/payloads/lean/NArithmetic/AddLaws.lean \
            LAB/payloads/lean/NArithmetic/MulRight.lean \
            LAB/payloads/lean/NArithmetic/MulLeft.lean \
            LAB/payloads/lean/NArithmetic/MulConvergence.lean \
            LAB/payloads/lean/NArithmetic/MulLaws.lean \
            LAB/payloads/lean/NArithmetic/OrderAdditive.lean \
            LAB/payloads/lean/NArithmetic/OrderInductive.lean \
            LAB/payloads/lean/NArithmetic/OrderConvergence.lean \
            LAB/payloads/lean/NArithmetic/OrderLaws.lean \
            LAB/payloads/lean/ZStage/ZSigned.lean \
            LAB/payloads/lean/ZStage/ZPairs.lean \
            LAB/payloads/lean/ZStage/ZRepresentationConvergence.lean \
            LAB/payloads/lean/ZStage/ZPairArithmetic.lean \
            LAB/payloads/lean/ZStage/ZSignedArithmeticDirect.lean \
            LAB/payloads/lean/ZStage/ZSignedArithmeticPair.lean \
            LAB/payloads/lean/ZStage/ZArithmeticConvergence.lean \
            LAB/payloads/lean/ZStage/ZArithmeticLaws.lean \
            LAB/payloads/lean/ZStage/ZOrderDirect.lean \
            LAB/payloads/lean/ZStage/ZOrderPair.lean \
            LAB/payloads/lean/ZStage/ZOrderConvergence.lean \
            LAB/payloads/lean/ZStage/ZOrderLaws.lean \
            LAB/payloads/lean/QStage/QGatewayCancellation.lean \
            LAB/payloads/lean/QStage/QFractions.lean \
            LAB/payloads/lean/QStage/QRawArithmetic.lean \
            LAB/payloads/lean/QStage/QRawAdditiveLaws.lean \
            LAB/payloads/lean/QStage/QQuotientCarrier.lean \
            LAB/payloads/lean/QStage/QQuotientAdditiveLaws.lean \
            LAB/payloads/lean/QStage/QOrderCore.lean \
            LAB/payloads/lean/QStage/QOrderAdditiveCompatibility.lean \
            > /tmp/QOrderAdditiveCompatibility.lean
          lake env lean /tmp/QOrderAdditiveCompatibility.lean
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          RESULT=PASS
          for x in "${{ steps.setup.outcome }}" "${{ steps.laws.outcome }}"; do
            if [ "$x" != success ]; then RESULT=FAIL_OR_INCOMPLETE; fi
          done
          git fetch origin main
          git checkout -B qorderadd-evidence origin/main
          mkdir -p LAB/20_FORMALIZATION/Q_STAGE/evidence
          cat > LAB/20_FORMALIZATION/Q_STAGE/evidence/Q_ORDER_ADDITIVE_COMPAT_V5_LATEST.md <<EOF
          # Q Order Additive Compatibility V5 Evidence
          **Status:** ${RESULT}  
          **Verified commit:** \`${GITHUB_SHA}\`  
          **Workflow run ID:** \`${GITHUB_RUN_ID}\`  
          **Pinned toolchain:** \`$(cat lean-toolchain)\`

          | Target | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | difference characterization + translation invariance + negation order reversal | ${{ steps.laws.outcome }} |
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAB/20_FORMALIZATION/Q_STAGE/evidence/Q_ORDER_ADDITIVE_COMPAT_V5_LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Q order-additive compatibility V5 run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.laws.outcome }}" = success
