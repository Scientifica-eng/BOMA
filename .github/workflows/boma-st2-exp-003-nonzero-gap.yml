name: BOMA ST2-EXP-003 Nonzero Gap Prerequisite — V5

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/stage-two-st2-exp-003-*'
    paths:
      - 'LAB/payloads/lean/RStage/ST2Exp003CauchyNonzeroGap.lean'
      - 'LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt'
      - 'LAB/PDSA/experiments/ST2-EXP-003_CAUCHY_REAL_ROUTE_STUDY.md'
      - '.github/workflows/boma-st2-exp-003-nonzero-gap.yml'

concurrency:
  group: boma-st2-exp-003-nonzero-gap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify fixed-sign separation before reciprocal construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin exact head and accepted baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          baseline=ea920b6b1e56444eddaf38ca91e6f7a968f10e0d
          frozen_plan=70dd2f307eba69d7309a90cc36ae6f49741abddd
          git merge-base --is-ancestor "$baseline" HEAD
          git merge-base --is-ancestor "$frozen_plan" HEAD
          git diff --exit-code "$frozen_plan" HEAD -- \
            LAB/PDSA/PDSA-ST2-EXP-003_INDEPENDENT_CAUCHY_REAL_ROUTE.md
          git diff --exit-code "$baseline" HEAD -- \
            LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt \
            LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt \
            LAB/20_FORMALIZATION/C_STAGE/C_ACCEPTED_INPUTS.txt

      - name: Validate inverse prerequisite boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest=LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt
          test "$(tail -n 1 "$manifest")" = \
            'LAB/payloads/lean/RStage/ST2Exp003CauchyNonzeroGap.lean'
          if grep -En 'RDedekind|RStageIntegration002|/CStage/|ST2Exp001|ST2Exp002' "$manifest"; then
            exit 1
          fi
          if grep -En 'BOMA\.R\.(Dedekind|StageIntegration002)|BOMA\.C\.|Classical\.|(^|[^[:alnum:]_])(sorry|axiom)([^[:alnum:]_]|$)' \
            LAB/payloads/lean/RStage/ST2Exp003CauchyNonzeroGap.lean; then
            exit 1
          fi

      - name: Setup pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Prove and print exact nonzero-gap commitments
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/BOMAST2Exp003NonzeroGap.lean
          : > "$target"
          while IFS= read -r src || [ -n "$src" ]; do
            [ -z "$src" ] && continue
            cat "$src" >> "$target"
            printf '\n' >> "$target"
          done < LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt
          {
            printf '\n#print axioms BOMA.R.StageTwo.CauchyNonzeroGap003.eventually_positive_gap_of_nonzero\n'
            printf '#print axioms BOMA.R.StageTwo.CauchyNonzeroGap003.eventually_negative_gap_of_nonzero\n'
            printf '#print axioms BOMA.R.StageTwo.CauchyNonzeroGap003.nonzero_eventually_sign_separated\n'
            printf '#print axioms BOMA.R.StageTwo.CauchyNonzeroGap003.cauchyNonzeroGapCertificate\n'
          } >> "$target"
          lake env lean "$target" 2>&1 | tee /tmp/st2-exp-003-nonzero-gap-lean.log

      - name: Extract exact prerequisite closure
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage R \
            --manifest LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt \
            --target BOMA.R.StageTwo.CauchyNonzeroGap003.cauchyNonzeroGapCertificate \
            --json-out /tmp/st2-exp-003-nonzero-gap-closure.json \
            > /tmp/st2-exp-003-nonzero-gap-audit.log
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/st2-exp-003-nonzero-gap-closure.json'))
          forbidden=('BOMA.R.Dedekind','BOMA.R.StageIntegration002','BOMA.C.')
          bad=[r['name'] for r in p['internal'] if r['name'].startswith(forbidden)]
          print(json.dumps({'status':p['status'],'counts':p['counts'],'forbidden_selected_or_downstream':bad},indent=2))
          if p['status'] != 'PROTOTYPE_PASS' or bad:
              raise SystemExit(1)
          PY

      - name: Preserve exact prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-003-nonzero-gap-${{ github.run_id }}
          path: |
            /tmp/st2-exp-003-nonzero-gap-lean.log
            /tmp/st2-exp-003-nonzero-gap-closure.json
            /tmp/st2-exp-003-nonzero-gap-audit.log
          if-no-files-found: warn
          retention-days: 30
