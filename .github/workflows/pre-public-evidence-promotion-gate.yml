name: BOMA Evidence Promotion Gate

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'LAB/20_FORMALIZATION/Q_STAGE/evidence/Q_INTEGRATION_V5_LATEST.md'
      - 'LAB/20_FORMALIZATION/R_STAGE/evidence/R_INTEGRATION_002_V5_LATEST.md'
      - 'LAB/payloads/lean/NCore/**'
      - 'LAB/payloads/lean/NArithmetic/**'
      - 'LAB/payloads/lean/ZStage/**'
      - 'LAB/payloads/lean/QStage/**'
      - 'LAB/payloads/lean/RStage/**'
      - 'LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt'
      - 'LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt'
      - '.github/workflows/boma-q-integration-001.yml'
      - '.github/workflows/boma-r-integration-002.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate evidence PR contents and freshness
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_SHA}"
          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          q_file='LAB/20_FORMALIZATION/Q_STAGE/evidence/Q_INTEGRATION_V5_LATEST.md'
          r_file='LAB/20_FORMALIZATION/R_STAGE/evidence/R_INTEGRATION_002_V5_LATEST.md'

          if printf '%s\n' "$changed" | grep -qx "$q_file"; then
            evidence_file="$q_file"
            input_paths=(
              LAB/payloads/lean/NCore/NCoreRB001.lean
              LAB/payloads/lean/NArithmetic
              LAB/payloads/lean/ZStage
              LAB/payloads/lean/QStage
              LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt
              .github/workflows/boma-q-integration-001.yml
              lean-toolchain
              lakefile.toml
            )
          elif printf '%s\n' "$changed" | grep -qx "$r_file"; then
            evidence_file="$r_file"
            input_paths=(
              LAB/payloads/lean/NCore
              LAB/payloads/lean/NArithmetic
              LAB/payloads/lean/ZStage
              LAB/payloads/lean/QStage
              LAB/payloads/lean/RStage
              LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt
              .github/workflows/boma-r-integration-002.yml
              lean-toolchain
            )
          else
            echo '::error::Evidence PR must change exactly one supported evidence file.'
            exit 1
          fi

          if [ "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo '::error::Evidence PR contains changes outside its single evidence file.'
            exit 1
          fi

          verified_sha=$(sed -n 's/^\*\*Verified commit:\*\* `\([0-9a-f]\{40\}\)`$/\1/p' "$evidence_file")
          test -n "$verified_sha"
          git merge-base --is-ancestor "$verified_sha" "$BASE_SHA"

          if ! git diff --quiet "$verified_sha" "$BASE_SHA" -- "${input_paths[@]}"; then
            echo '::error::Verification inputs changed on main after the evidence was generated. Regenerate evidence before merge.'
            exit 1
          fi
