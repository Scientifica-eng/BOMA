name: BOMA ST2-EXP-004 Gate D — Same-Carrier Totality Boundary

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'LAB/PDSA/PDSA-ST2-EXP-004_R_TOTAL_ORDER_LOGICAL_REGIME.md'
      - 'LAB/PDSA/experiments/ST2-EXP-004_*'
      - 'LAB/payloads/lean/RStage/ST2Exp004SameCarrierTotalityBoundary.lean'
      - '.github/workflows/boma-st2-exp-004-gate-d-same-carrier-totality.yml'
  push:
    branches:
      - 'feature/stage-two-st2-exp-004-*'

concurrency:
  group: boma-st2-exp-004-gate-d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-d:
    name: verify same-carrier totality boundary without F-04 recovery claim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify frozen authority and prior gates
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          baseline="50f3031b8d2657cbe0710e73e5935d997d40e49b"
          frozen="89c9dc9154e7ca469e5c94c177be223205ee9dbd"
          test "$(git rev-parse HEAD)" = "$expected"
          git merge-base --is-ancestor "$baseline" HEAD
          git merge-base --is-ancestor "$frozen" HEAD
          git merge-base --is-ancestor b03419c300e8ffce62a0dfec62faed54923781d4 HEAD
          git diff --exit-code "$frozen" HEAD -- LAB/PDSA/PDSA-ST2-EXP-004_R_TOTAL_ORDER_LOGICAL_REGIME.md
          grep -Fq 'Gate C final disposition:** `PASS / CONDITIONAL INTERFACE ISOLATED / GATE D NEXT`' LAB/PDSA/experiments/ST2-EXP-004_GATE_C_CONDITIONAL_COMPARABILITY_001.md
          printf 'verified_head=%s\nfrozen_reference=%s\nfrozen_plan=%s\n' "$expected" "$baseline" "$frozen" | tee /tmp/st2-exp-004-gate-d-provenance.txt

      - name: Re-prove accepted controls unchanged
        shell: bash
        run: |
          set -euo pipefail
          baseline="50f3031b8d2657cbe0710e73e5935d997d40e49b"
          for manifest in LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt LAB/20_FORMALIZATION/C_STAGE/C_ACCEPTED_INPUTS.txt; do
            git diff --exit-code "$baseline" HEAD -- "$manifest"
            while IFS= read -r src || [ -n "$src" ]; do
              [ -z "$src" ] && continue
              git diff --exit-code "$baseline" HEAD -- "$src"
            done < "$manifest"
          done
          git diff --exit-code "$baseline" HEAD -- LAB/10_CONSTRUCTION/decisions/R-DP-003/UNIT.md

      - name: Verify frozen LowerCut contract and no logical substitution
        shell: bash
        run: |
          set -euo pipefail
          src=LAB/payloads/lean/RStage/ST2Exp004SameCarrierTotalityBoundary.lean
          ! grep -nE 'Classical\.(em|byContradiction|choose)|(^|[^A-Za-z])axiom([^A-Za-z]|$)|(^|[^A-Za-z])sorry([^A-Za-z]|$)|cutComparability_classical|rLE_total_classical' "$src"
          python3 - <<'PY'
          from pathlib import Path
          text=Path('LAB/payloads/lean/RStage/RDedekindProbe.lean').read_text()
          required=['lower : QBOMA → Prop','nonempty : ∃ q : QBOMA, lower q','proper : ∃ q : QBOMA, ¬ lower q','downward :','rounded :']
          assert all(x in text for x in required)
          assert 'located' not in text.lower()
          assert 'CutComparability' not in text
          Path('/tmp/st2-exp-004-gate-d-contract.txt').write_text('LowerCut fields: lower, nonempty, proper, downward, rounded\nlocatedness field: absent\nCutComparability field: absent\n')
          PY

      - name: Setup pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Build no-F04 base and append Gate-D boundary probe
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_004_gate_b_survivor_assembly.py \
            --manifest-out /tmp/ST2_EXP_004_GATE_D_BASE.txt \
            --json-out /tmp/st2-exp-004-gate-d-base.json \
            > /tmp/st2-exp-004-gate-d-base.log 2>&1
          cp /tmp/ST2_EXP_004_GATE_D_BASE.txt .boma-st2-exp-004-gate-d-inputs.txt
          printf '%s\n' 'LAB/payloads/lean/RStage/ST2Exp004SameCarrierTotalityBoundary.lean' >> .boma-st2-exp-004-gate-d-inputs.txt
          ! grep -Fq 'RDedekindOrderClassicalWitness.lean' .boma-st2-exp-004-gate-d-inputs.txt
          cp .boma-st2-exp-004-gate-d-inputs.txt /tmp/ST2_EXP_004_GATE_D_INPUTS.txt

      - name: Kernel and dependency audit boundary equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage ST2Exp004GateD \
            --manifest .boma-st2-exp-004-gate-d-inputs.txt \
            --target BOMA.R.StageTwo.TotalOrderRegime004.SameCarrier.cutComparability_of_rLE_total004 \
            --target BOMA.R.StageTwo.TotalOrderRegime004.SameCarrier.rLE_totality_iff_cutComparability004 \
            --json-out /tmp/st2-exp-004-gate-d-deps.json \
            2>&1 | tee /tmp/st2-exp-004-gate-d-deps.log
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/st2-exp-004-gate-d-deps.json'))
          assert d['status']=='PROTOTYPE_PASS'
          names={x['name'] for x in d['internal']} | {x['name'] for x in d['external_boundary']}
          assert 'BOMA.R.DedekindOrderClassical001.cutComparability_classical' not in names
          assert 'BOMA.R.DedekindOrderClassical001.rLE_total_classical' not in names
          result={
            'schema':'BOMA-ST2-EXP-004-GATE-D-SAME-CARRIER-TOTALITY-001',
            'status':'GATE_D_PASS',
            'outcome':'NOT_RECOVERED_WITH_CURRENT_CUT_INTERFACE',
            'same_carrier_totality_equivalent_to_cut_comparability':True,
            'unconditional_totality_recovered':False,
            'locatedness_added':False,
            'representation_changed':False,
            'new_logical_principle_added':False,
            'selected_f04_present':False,
            'counts':d['counts'],
            'internal_axioms':d['internal_axioms'],
            'unresolved':d['unresolved'],
          }
          open('/tmp/st2-exp-004-gate-d.json','w').write(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Print boundary theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          chunks=[Path(p.strip()).read_text() for p in Path('.boma-st2-exp-004-gate-d-inputs.txt').read_text().splitlines() if p.strip()]
          chunks.append('''
          #print axioms BOMA.R.StageTwo.TotalOrderRegime004.SameCarrier.cutComparability_of_rLE_total004
          #print axioms BOMA.R.StageTwo.TotalOrderRegime004.SameCarrier.rLE_totality_iff_cutComparability004
          ''')
          Path('/tmp/ST2Exp004GateDCheck.lean').write_text('\n'.join(chunks)+'\n')
          PY
          lake env lean /tmp/ST2Exp004GateDCheck.lean 2>&1 | tee /tmp/st2-exp-004-gate-d-axioms.txt

      - name: Upload Gate-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-004-gate-d-${{ github.run_id }}
          path: |
            /tmp/st2-exp-004-gate-d-provenance.txt
            /tmp/st2-exp-004-gate-d-contract.txt
            /tmp/ST2_EXP_004_GATE_D_INPUTS.txt
            /tmp/st2-exp-004-gate-d-base.json
            /tmp/st2-exp-004-gate-d-deps.json
            /tmp/st2-exp-004-gate-d-deps.log
            /tmp/st2-exp-004-gate-d.json
            /tmp/st2-exp-004-gate-d-axioms.txt
          if-no-files-found: warn
