name: BOMA N-Order R-B — Evidence V5
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LAB/payloads/lean/NArithmetic/Order*.lean'
      - '.github/workflows/boma-n-order-rb-001-evidence.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'
jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Additive witness route
        id: additive
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/NArithmetic/AddRight.lean LAB/payloads/lean/NArithmetic/AddLeft.lean LAB/payloads/lean/NArithmetic/AddConvergence.lean LAB/payloads/lean/NArithmetic/AddLaws.lean LAB/payloads/lean/NArithmetic/OrderAdditive.lean > /tmp/OrderAdditive.lean
          lake env lean /tmp/OrderAdditive.lean
      - name: Independent inductive route
        id: inductive
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/NArithmetic/OrderInductive.lean > /tmp/OrderInductive.lean
          lake env lean /tmp/OrderInductive.lean
      - name: Order convergence
        id: convergence
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/NArithmetic/AddRight.lean LAB/payloads/lean/NArithmetic/AddLeft.lean LAB/payloads/lean/NArithmetic/AddConvergence.lean LAB/payloads/lean/NArithmetic/AddLaws.lean LAB/payloads/lean/NArithmetic/OrderAdditive.lean LAB/payloads/lean/NArithmetic/OrderInductive.lean LAB/payloads/lean/NArithmetic/OrderConvergence.lean > /tmp/OrderConvergence.lean
          lake env lean /tmp/OrderConvergence.lean
      - name: Canonical order laws and arithmetic compatibility
        id: laws
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/NArithmetic/AddRight.lean LAB/payloads/lean/NArithmetic/AddLeft.lean LAB/payloads/lean/NArithmetic/AddConvergence.lean LAB/payloads/lean/NArithmetic/AddLaws.lean LAB/payloads/lean/NArithmetic/MulRight.lean LAB/payloads/lean/NArithmetic/MulLeft.lean LAB/payloads/lean/NArithmetic/MulConvergence.lean LAB/payloads/lean/NArithmetic/MulLaws.lean LAB/payloads/lean/NArithmetic/OrderAdditive.lean LAB/payloads/lean/NArithmetic/OrderInductive.lean LAB/payloads/lean/NArithmetic/OrderConvergence.lean LAB/payloads/lean/NArithmetic/OrderLaws.lean > /tmp/OrderLaws.lean
          lake env lean /tmp/OrderLaws.lean
      - name: Record evidence
        if: always()
        shell: bash
        run: |
          RESULT=PASS
          for x in "${{ steps.setup.outcome }}" "${{ steps.additive.outcome }}" "${{ steps.inductive.outcome }}" "${{ steps.convergence.outcome }}" "${{ steps.laws.outcome }}"; do if [ "$x" != success ]; then RESULT=FAIL_OR_INCOMPLETE; fi; done
          git fetch origin main
          git checkout -B order-evidence origin/main
          mkdir -p LAB/20_FORMALIZATION/N_ARITHMETIC/evidence
          cat > LAB/20_FORMALIZATION/N_ARITHMETIC/evidence/N_ORD_V5_LATEST.md <<EOF
          # N-Order Claim-Level V5 Evidence
          **Status:** ${RESULT}  
          **Verified commit:** \`${GITHUB_SHA}\`  
          **Workflow run ID:** \`${GITHUB_RUN_ID}\`  
          **Pinned toolchain:** \`$(cat lean-toolchain)\`

          | Target | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | Additive-witness route | ${{ steps.additive.outcome }} |
          | Independent inductive route | ${{ steps.inductive.outcome }} |
          | Route convergence | ${{ steps.convergence.outcome }} |
          | Canonical laws / arithmetic compatibility | ${{ steps.laws.outcome }} |
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAB/20_FORMALIZATION/N_ARITHMETIC/evidence/N_ORD_V5_LATEST.md
          if ! git diff --cached --quiet; then git commit -m "Record N-order V5 run ${GITHUB_RUN_ID}"; git push origin HEAD:main; fi
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.additive.outcome }}" = success
          test "${{ steps.inductive.outcome }}" = success
          test "${{ steps.convergence.outcome }}" = success
          test "${{ steps.laws.outcome }}" = success
