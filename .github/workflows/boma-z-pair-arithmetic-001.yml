name: BOMA Z Pair Arithmetic — Claim-Level V5

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LAB/payloads/lean/ZStage/ZPairArithmetic.lean'
      - '.github/workflows/boma-z-pair-arithmetic-001.yml'
      - 'lean-toolchain'

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Verify pair arithmetic and equivalence compatibility
        id: pairarith
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat \
            LAB/payloads/lean/NCore/NCoreRB001.lean \
            LAB/payloads/lean/NArithmetic/AddRight.lean \
            LAB/payloads/lean/NArithmetic/AddLeft.lean \
            LAB/payloads/lean/NArithmetic/AddConvergence.lean \
            LAB/payloads/lean/NArithmetic/AddLaws.lean \
            LAB/payloads/lean/NArithmetic/MulRight.lean \
            LAB/payloads/lean/NArithmetic/MulLeft.lean \
            LAB/payloads/lean/NArithmetic/MulConvergence.lean \
            LAB/payloads/lean/NArithmetic/MulLaws.lean \
            LAB/payloads/lean/ZStage/ZPairs.lean \
            LAB/payloads/lean/ZStage/ZPairArithmetic.lean \
            > /tmp/ZPairArithmetic.lean
          lake env lean /tmp/ZPairArithmetic.lean

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          RESULT=PASS
          for x in "${{ steps.setup.outcome }}" "${{ steps.pairarith.outcome }}"; do
            if [ "$x" != success ]; then RESULT=FAIL_OR_INCOMPLETE; fi
          done
          git fetch origin main
          git checkout -B zpairarith-evidence origin/main
          mkdir -p LAB/20_FORMALIZATION/Z_STAGE/evidence
          cat > LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_PAIR_ARITH_V5_LATEST.md <<EOF
          # Z Difference-Pair Arithmetic V5 Evidence
          **Status:** ${RESULT}  
          **Verified commit:** \`${GITHUB_SHA}\`  
          **Workflow run ID:** \`${GITHUB_RUN_ID}\`  
          **Pinned toolchain:** \`$(cat lean-toolchain)\`

          | Target | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | pair arithmetic / equivalence compatibility | ${{ steps.pairarith.outcome }} |
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_PAIR_ARITH_V5_LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Z pair-arithmetic V5 run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Enforce
        if: always()
        run: |
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.pairarith.outcome }}" = success
