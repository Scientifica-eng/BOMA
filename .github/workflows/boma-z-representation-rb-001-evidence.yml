name: BOMA Z Representation — Evidence V5

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LAB/payloads/lean/ZStage/*.lean'
      - '.github/workflows/boma-z-representation-rb-001-evidence.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Signed route
        id: signed
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/ZStage/ZSigned.lean > /tmp/ZSigned.lean
          lake env lean /tmp/ZSigned.lean
      - name: Pair route
        id: pair
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/NArithmetic/AddRight.lean LAB/payloads/lean/NArithmetic/AddLeft.lean LAB/payloads/lean/NArithmetic/AddConvergence.lean LAB/payloads/lean/NArithmetic/AddLaws.lean LAB/payloads/lean/ZStage/ZPairs.lean > /tmp/ZPairs.lean
          lake env lean /tmp/ZPairs.lean
      - name: Representation convergence
        id: convergence
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          cat LAB/payloads/lean/NCore/NCoreRB001.lean LAB/payloads/lean/NArithmetic/AddRight.lean LAB/payloads/lean/NArithmetic/AddLeft.lean LAB/payloads/lean/NArithmetic/AddConvergence.lean LAB/payloads/lean/NArithmetic/AddLaws.lean LAB/payloads/lean/ZStage/ZSigned.lean LAB/payloads/lean/ZStage/ZPairs.lean LAB/payloads/lean/ZStage/ZRepresentationConvergence.lean > /tmp/ZRepresentationConvergence.lean
          lake env lean /tmp/ZRepresentationConvergence.lean
      - name: Generate run evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/boma-evidence
          RESULT=PASS
          for x in "${{ steps.setup.outcome }}" "${{ steps.signed.outcome }}" "${{ steps.pair.outcome }}" "${{ steps.convergence.outcome }}"; do
            if [ "$x" != success ]; then RESULT=FAIL_OR_INCOMPLETE; fi
          done
          cat > /tmp/boma-evidence/Z_REP_V5_LATEST.md <<EOF
          # Integer Representation V5 Evidence

          **Status:** ${RESULT}  
          **Verified commit:** \`${GITHUB_SHA}\`  
          **Workflow run ID:** \`${GITHUB_RUN_ID}\`  
          **Pinned toolchain:** \`$(cat lean-toolchain)\`

          | Target | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | Signed route | ${{ steps.signed.outcome }} |
          | Difference-pair route | ${{ steps.pair.outcome }} |
          | Representation convergence | ${{ steps.convergence.outcome }} |
          EOF

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z-representation-v5-evidence-${{ github.run_id }}
          path: /tmp/boma-evidence/Z_REP_V5_LATEST.md
          if-no-files-found: error
          retention-days: 90

      - name: Enforce
        if: always()
        run: |
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.signed.outcome }}" = success
          test "${{ steps.pair.outcome }}" = success
          test "${{ steps.convergence.outcome }}" = success
