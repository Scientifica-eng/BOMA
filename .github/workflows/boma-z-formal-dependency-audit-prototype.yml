name: BOMA Z Formal Dependency Audit — Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/claim-transparency-001
    paths:
      - 'LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json'
      - 'LAB/00_ARCHITECTURE/Z_FORMAL_CLAIM_PRODUCER_POLICY.json'
      - 'LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md'
      - 'LAB/00_ARCHITECTURE/tools/LeanDependencyExtractor.lean'
      - 'LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py'
      - 'LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py'
      - 'LAB/00_ARCHITECTURE/tools/formal_claim_producer_compare.py'
      - 'LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt'
      - 'LAB/payloads/lean/NCore/**'
      - 'LAB/payloads/lean/NArithmetic/**'
      - 'LAB/payloads/lean/ZStage/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/boma-z-formal-dependency-audit-prototype.yml'

permissions:
  contents: write

concurrency:
  group: boma-formal-transparency-evidence-architecture-claim-transparency-001
  cancel-in-progress: false

jobs:
  audit-z-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Extract actual Z accepted-claim declaration closure
        id: audit
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ARGS=()
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            TARGET_ARGS+=(--target "$target")
          done < <(python3 - <<'PY'
          import json
          with open('LAB/00_ARCHITECTURE/Z_FORMAL_CLAIM_PRODUCER_POLICY.json', encoding='utf-8') as fh:
              policy = json.load(fh)
          for target in policy['audit_targets']:
              print(target)
          PY
          )
          test "${#TARGET_ARGS[@]}" -gt 0
          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage Z \
            --manifest LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt \
            "${TARGET_ARGS[@]}" \
            --json-out /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
            > /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout 2>&1
          cat /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout

      - name: Classify Z formal boundary against declared policy
        id: classify
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py \
            --closure /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
            --policy LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json \
            --json-out /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json \
            > /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout 2>&1
          cat /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout

      - name: Compare actual Z closure with Z Claim producers
        id: claimmap
        if: steps.classify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/formal_claim_producer_compare.py \
            --closure /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
            --classification /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json \
            --policy LAB/00_ARCHITECTURE/Z_FORMAL_CLAIM_PRODUCER_POLICY.json \
            --registry LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md \
            --json-out /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.json \
            > /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.stdout 2>&1
          cat /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.stdout

      - name: Record Z prototype evidence on feature branch
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=PROTOTYPE_PASS
          if [ "${{ steps.setup.outcome }}" != success ] || [ "${{ steps.audit.outcome }}" != success ]; then
            RESULT=PROTOTYPE_FAIL
          fi

          CLASSIFICATION_STATUS=NO_OUTPUT
          if [ -f /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json ]; then
            CLASSIFICATION_STATUS="$(python3 - <<'PY'
          import json
          with open('/tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json', encoding='utf-8') as fh:
              print(json.load(fh).get('status', 'UNKNOWN'))
          PY
          )"
          elif [ "${{ steps.classify.outcome }}" = skipped ]; then
            CLASSIFICATION_STATUS=SKIPPED
          fi

          CLAIM_PRODUCER_STATUS=NO_OUTPUT
          if [ -f /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.json ]; then
            CLAIM_PRODUCER_STATUS="$(python3 - <<'PY'
          import json
          with open('/tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.json', encoding='utf-8') as fh:
              print(json.load(fh).get('status', 'UNKNOWN'))
          PY
          )"
          elif [ "${{ steps.claimmap.outcome }}" = skipped ]; then
            CLAIM_PRODUCER_STATUS=SKIPPED
          fi

          BRANCH='architecture/claim-transparency-001'
          VERIFIED_SHA="$GITHUB_SHA"
          RUN_ID="$GITHUB_RUN_ID"
          TOOLCHAIN="$(cat lean-toolchain 2>/dev/null || echo UNKNOWN)"

          git fetch origin "$BRANCH"
          CURRENT_HEAD="$(git rev-parse "origin/$BRANCH")"
          if [ "$CURRENT_HEAD" != "$VERIFIED_SHA" ]; then
            CHANGED_VERIFICATION_INPUTS="$(git diff --name-only "$VERIFIED_SHA" "$CURRENT_HEAD" -- \
              LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json \
              LAB/00_ARCHITECTURE/Z_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md \
              LAB/00_ARCHITECTURE/tools/LeanDependencyExtractor.lean \
              LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
              LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py \
              LAB/00_ARCHITECTURE/tools/formal_claim_producer_compare.py \
              LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt \
              LAB/payloads/lean/NCore \
              LAB/payloads/lean/NArithmetic \
              LAB/payloads/lean/ZStage \
              lean-toolchain \
              lakefile.toml \
              .github/workflows/boma-z-formal-dependency-audit-prototype.yml)"
            if [ -n "$CHANGED_VERIFICATION_INPUTS" ]; then
              echo '::error::Z verification inputs changed after this audit started; refusing stale prototype evidence promotion.'
              printf '%s\n' "$CHANGED_VERIFICATION_INPUTS"
              exit 1
            fi
            echo 'Branch moved only outside Z verification inputs; recording evidence against the audited source SHA.'
          fi

          git checkout -B z-claim-transparency-evidence "origin/$BRANCH"
          mkdir -p LAB/20_FORMALIZATION/Z_STAGE/evidence

          if [ -f /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json ]; then
            cp /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
              LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.json
          else
            cat > LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.json <<EOF
          {
            "status": "PROTOTYPE_FAIL",
            "reason": "dependency extractor did not produce JSON output",
            "verified_commit": "${VERIFIED_SHA}",
            "workflow_run": "${RUN_ID}"
          }
          EOF
          fi

          if [ -f /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json ]; then
            cp /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json \
              LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE_LATEST.json
          else
            cat > LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE_LATEST.json <<EOF
          {
            "status": "${CLASSIFICATION_STATUS}",
            "reason": "semantic classification did not produce JSON output",
            "verified_commit": "${VERIFIED_SHA}",
            "workflow_run": "${RUN_ID}"
          }
          EOF
          fi

          if [ -f /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.json ]; then
            cp /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.json \
              LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE_LATEST.json
          else
            cat > LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE_LATEST.json <<EOF
          {
            "status": "${CLAIM_PRODUCER_STATUS}",
            "reason": "Claim/producer comparison did not produce JSON output",
            "verified_commit": "${VERIFIED_SHA}",
            "workflow_run": "${RUN_ID}"
          }
          EOF
          fi

          cat > LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md <<EOF
          # Z Formal Dependency Closure — Prototype Evidence

          **Status:** ${RESULT}  
          **Boundary classification:** ${CLASSIFICATION_STATUS}  
          **Claim/producer comparison:** ${CLAIM_PRODUCER_STATUS}  
          **Audited source commit:** \`${VERIFIED_SHA}\`  
          **Workflow run ID:** \`${RUN_ID}\`  
          **Pinned toolchain:** \`${TOOLCHAIN}\`  
          **Root mode:** \`producer_union\` over accepted Z representation/ring/order targets  
          **Accepted assembly manifest:** \`LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt\`

          | Step | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | compile Z accepted assembly + extract multi-target transitive closure | ${{ steps.audit.outcome }} |
          | classify boundary against explicit dependency policy | ${{ steps.classify.outcome }} |
          | compare actual closure against Z Claim/producer policy | ${{ steps.claimmap.outcome }} |

          ## Scope boundary

          This prototype audits the existing accepted Z representation/reconvergence/ring/order surface without introducing a quotient carrier, new theorem statement, or synthetic integration certificate. `PROTOTYPE_PASS` alone is not a Z transparency certification.

          `CLASSIFICATION_PASS` requires zero unclassified formal boundary residuals. `CLAIM_PRODUCER_PASS` requires exact Z Claim-registry agreement, declared producers in the actual closure, audit roots that are themselves declared Claim producers, and zero internal declarations without producer ancestry.
          EOF

          if [ -f /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.stdout ]; then
            {
              echo
              echo '## Claim/producer comparison log tail'
              echo
              echo '```text'
              tail -n 160 /tmp/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE.stdout
              echo '```'
            } >> LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          elif [ -f /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout ]; then
            {
              echo
              echo '## Boundary classification log tail'
              echo
              echo '```text'
              tail -n 120 /tmp/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout
              echo '```'
            } >> LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          elif [ -f /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout ]; then
            {
              echo
              echo '## Extractor log tail'
              echo
              echo '```text'
              tail -n 120 /tmp/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout
              echo '```'
            } >> LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.json \
            LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE_LATEST.json \
            LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_CLAIM_PRODUCER_COMPARISON_PROTOTYPE_LATEST.json \
            LAB/20_FORMALIZATION/Z_STAGE/evidence/Z_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Z formal dependency prototype run ${RUN_ID}"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Enforce full Z prototype comparison
        if: always()
        shell: bash
        run: |
          set -e
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.audit.outcome }}" = success
          test "${{ steps.classify.outcome }}" = success
          test "${{ steps.claimmap.outcome }}" = success
          test "${{ steps.evidence.outcome }}" = success

      - name: Record scope in job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Z Formal Dependency Closure Prototype

          This workflow audits the accepted Z representation/reconvergence/ring/order surface and preserves the signed-vs-pair and direct-vs-pair provenance rather than collapsing those histories into one synthetic certificate.

          A later Z transparency promotion requires zero formal-boundary residuals and zero Claim/producer residuals. This workflow does not change ZA-21, merge the branch, or authorize C.
          EOF
