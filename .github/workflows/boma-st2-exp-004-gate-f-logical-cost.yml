name: BOMA ST2-EXP-004 Gate F — Logical Cost Comparison

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feature/stage-two-st2-exp-004-*'

concurrency:
  group: boma-st2-exp-004-historical-gate-f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_historical_gate:
    name: verify immutable historical Gate F
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify read-only historical Gate F
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_004_historical_gate_sentinel.py \
            --gate F \
            --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' \
            --json-out /tmp/st2-exp-004-historical-gate-f.json
          test -z "$(git status --porcelain=v1)"

      - name: Upload historical Gate F sentinel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-004-historical-gate-f-${{ github.run_id }}
          path: /tmp/st2-exp-004-historical-gate-f.json
          if-no-files-found: warn
