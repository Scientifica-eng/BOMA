name: BOMA Stage Transparency Matrix — N-Core through R

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/claim-transparency-001
    paths:
      - 'LAB/00_ARCHITECTURE/STAGE_TRANSPARENCY_MATRIX.json'
      - 'LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json'
      - 'LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md'
      - 'LAB/00_ARCHITECTURE/*_FORMAL_CLAIM_PRODUCER_POLICY.json'
      - 'LAB/00_ARCHITECTURE/tools/LeanDependencyExtractor.lean'
      - 'LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py'
      - 'LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py'
      - 'LAB/00_ARCHITECTURE/tools/formal_claim_producer_compare.py'
      - 'LAB/00_ARCHITECTURE/tools/run_stage_transparency_matrix.py'
      - 'LAB/20_FORMALIZATION/N_CORE/N_CORE_ACCEPTED_INPUTS.txt'
      - 'LAB/20_FORMALIZATION/N_ARITHMETIC/N_ARITH_ACCEPTED_INPUTS.txt'
      - 'LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt'
      - 'LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt'
      - 'LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt'
      - 'LAB/payloads/lean/NCore/**'
      - 'LAB/payloads/lean/NArithmetic/**'
      - 'LAB/payloads/lean/ZStage/**'
      - 'LAB/payloads/lean/QStage/**'
      - 'LAB/payloads/lean/RStage/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/boma-stage-transparency-matrix-001.yml'

permissions:
  contents: write

concurrency:
  group: boma-stage-transparency-matrix-architecture-claim-transparency-001
  cancel-in-progress: true

jobs:
  verify-all-accepted-stages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Run independent stage transparency audits as one matrix transaction
        id: matrix
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boma-stage-transparency-work /tmp/boma-stage-transparency-rendered
          mkdir -p /tmp/boma-stage-transparency-work /tmp/boma-stage-transparency-rendered
          TOOLCHAIN="$(cat lean-toolchain 2>/dev/null || echo UNKNOWN)"
          python3 LAB/00_ARCHITECTURE/tools/run_stage_transparency_matrix.py \
            --work-dir /tmp/boma-stage-transparency-work \
            --rendered-root /tmp/boma-stage-transparency-rendered \
            --audited-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --toolchain "$TOOLCHAIN" \
            --summary-out /tmp/boma-stage-transparency-work/MATRIX_SUMMARY.json

      - name: Promote all stage evidence in one provenance transaction
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='architecture/claim-transparency-001'
          AUDITED_SHA="$GITHUB_SHA"
          RUN_ID="$GITHUB_RUN_ID"
          TOOLCHAIN="$(cat lean-toolchain 2>/dev/null || echo UNKNOWN)"

          if [ "${{ steps.setup.outcome }}" != success ]; then
            echo '::error::Lean setup failed; no trustworthy matrix evidence can be promoted.'
            exit 1
          fi
          if [ ! -f /tmp/boma-stage-transparency-work/MATRIX_SUMMARY.json ]; then
            echo '::error::Matrix runner produced no summary.'
            exit 1
          fi

          check_input_drift() {
            local remote_sha="$1"
            git diff --quiet "$AUDITED_SHA" "$remote_sha" -- \
              LAB/00_ARCHITECTURE/STAGE_TRANSPARENCY_MATRIX.json \
              LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json \
              LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md \
              LAB/00_ARCHITECTURE/N_CORE_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/N_ARITH_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/Z_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/Q_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/R_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/tools/LeanDependencyExtractor.lean \
              LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
              LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py \
              LAB/00_ARCHITECTURE/tools/formal_claim_producer_compare.py \
              LAB/00_ARCHITECTURE/tools/run_stage_transparency_matrix.py \
              LAB/20_FORMALIZATION/N_CORE/N_CORE_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/N_ARITHMETIC/N_ARITH_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt \
              LAB/payloads/lean/NCore \
              LAB/payloads/lean/NArithmetic \
              LAB/payloads/lean/ZStage \
              LAB/payloads/lean/QStage \
              LAB/payloads/lean/RStage \
              lean-toolchain \
              lakefile.toml \
              .github/workflows/boma-stage-transparency-matrix-001.yml
          }

          git fetch origin "$BRANCH"
          CURRENT_HEAD="$(git rev-parse "origin/$BRANCH")"
          if ! check_input_drift "$CURRENT_HEAD"; then
            echo '::error::Transparency verification inputs changed after this matrix started; refusing stale evidence promotion.'
            git diff --name-only "$AUDITED_SHA" "$CURRENT_HEAD" -- \
              LAB/00_ARCHITECTURE/STAGE_TRANSPARENCY_MATRIX.json \
              LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json \
              LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md \
              LAB/00_ARCHITECTURE/*_FORMAL_CLAIM_PRODUCER_POLICY.json \
              LAB/00_ARCHITECTURE/tools/LeanDependencyExtractor.lean \
              LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
              LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py \
              LAB/00_ARCHITECTURE/tools/formal_claim_producer_compare.py \
              LAB/00_ARCHITECTURE/tools/run_stage_transparency_matrix.py \
              LAB/20_FORMALIZATION/N_CORE/N_CORE_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/N_ARITHMETIC/N_ARITH_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/Z_STAGE/Z_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt \
              LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt \
              LAB/payloads/lean/NCore LAB/payloads/lean/NArithmetic LAB/payloads/lean/ZStage LAB/payloads/lean/QStage LAB/payloads/lean/RStage \
              lean-toolchain lakefile.toml .github/workflows/boma-stage-transparency-matrix-001.yml
            exit 1
          fi

          git checkout -B stage-transparency-matrix-evidence "origin/$BRANCH"
          cp -R /tmp/boma-stage-transparency-rendered/LAB/. LAB/

          mkdir -p LAB/00_ARCHITECTURE/evidence
          cp /tmp/boma-stage-transparency-work/MATRIX_SUMMARY.json \
            LAB/00_ARCHITECTURE/evidence/STAGE_TRANSPARENCY_MATRIX_LATEST.json

          MATRIX_STATUS="$(python3 - <<'PY'
          import json
          with open('/tmp/boma-stage-transparency-work/MATRIX_SUMMARY.json', encoding='utf-8') as fh:
              print(json.load(fh).get('status', 'UNKNOWN'))
          PY
          )"
          cat > LAB/00_ARCHITECTURE/evidence/STAGE_TRANSPARENCY_MATRIX_LATEST.md <<EOF
          # BOMA Stage Transparency Matrix Evidence

          **Status:** ${MATRIX_STATUS}  
          **Audited source commit:** \`${AUDITED_SHA}\`  
          **Workflow run ID:** \`${RUN_ID}\`  
          **Pinned toolchain:** \`${TOOLCHAIN}\`

          N-Core, N-Arithmetic, Z, Q, and R are audited independently against their own accepted manifests and Claim-producer policies, but their latest evidence is promoted in one repository transaction to avoid cross-stage cancellation and branch-write races.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            LAB/20_FORMALIZATION/N_CORE/evidence \
            LAB/20_FORMALIZATION/N_ARITHMETIC/evidence \
            LAB/20_FORMALIZATION/Z_STAGE/evidence \
            LAB/20_FORMALIZATION/Q_STAGE/evidence \
            LAB/20_FORMALIZATION/R_STAGE/evidence \
            LAB/00_ARCHITECTURE/evidence/STAGE_TRANSPARENCY_MATRIX_LATEST.json \
            LAB/00_ARCHITECTURE/evidence/STAGE_TRANSPARENCY_MATRIX_LATEST.md

          if git diff --cached --quiet; then
            echo 'No matrix evidence change to promote.'
            exit 0
          fi
          git commit -m "Record stage transparency matrix run ${RUN_ID}"

          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            REMOTE_HEAD="$(git rev-parse "origin/$BRANCH")"
            if ! check_input_drift "$REMOTE_HEAD"; then
              echo '::error::Verification inputs changed while evidence promotion was retrying; refusing stale evidence.'
              exit 1
            fi

            if ! git merge-base --is-ancestor "$REMOTE_HEAD" HEAD; then
              git rebase "origin/$BRANCH"
            fi

            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            echo "Evidence push attempt ${attempt} lost a branch race; refetching/rebasing."
          done

          echo '::error::Unable to promote matrix evidence after retries.'
          exit 1

      - name: Enforce full matrix verification
        if: always()
        shell: bash
        run: |
          set -e
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.matrix.outcome }}" = success
          test "${{ steps.evidence.outcome }}" = success

      - name: Record scope in job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## N-Core → R Transparency Matrix

          This workflow is the canonical push-triggered theorem-transparency evidence producer for all currently accepted stages. Stage closures remain mathematically/formally independent; only execution and evidence promotion are serialized into one source transaction.

          It does not alter acceptance, merge the architecture branch, or authorize C.
          EOF
