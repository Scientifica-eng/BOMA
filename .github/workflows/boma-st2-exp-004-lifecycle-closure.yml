name: BOMA ST2-EXP-004 Lifecycle Closure

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'LAB/PDSA/PDSA-ST2-EXP-004_R_TOTAL_ORDER_LOGICAL_REGIME.md'
      - 'LAB/PDSA/experiments/ST2-EXP-004_*'
      - 'LAB/PDSA/STAGE_TWO_BRANCH_ORIGIN_LEDGER_001.*'
      - 'LAB/PDSA/STAGE_TWO_BRANCH_EXPERIMENT_REGISTER_001.md'
      - 'LAB/PDSA/STAGE_TWO_SUCCESSFUL_EXPERIMENTS_ARCHITECTURE_INTEGRATION_003.md'
      - 'LAB/PDSA/STATUS.md'
      - 'LAB/10_CONSTRUCTION/decisions/R-DP-003/UNIT.md'
      - 'LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py'
      - 'LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py'
      - 'LAB/00_ARCHITECTURE/tools/stage_two_historical_closure_audit.py'
      - '.github/workflows/boma-st2-exp-004-lifecycle-closure.yml'
  push:
    branches:
      - 'feature/stage-two-st2-exp-004-*'

concurrency:
  group: boma-st2-exp-004-closed-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_closed_state:
    name: verify immutable closed-state provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head and immutable frozen authority
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          baseline='50f3031b8d2657cbe0710e73e5935d997d40e49b'
          frozen='89c9dc9154e7ca469e5c94c177be223205ee9dbd'
          plan='LAB/PDSA/PDSA-ST2-EXP-004_R_TOTAL_ORDER_LOGICAL_REGIME.md'
          test "$(git rev-parse HEAD)" = "$expected"
          git merge-base --is-ancestor "$baseline" HEAD
          git merge-base --is-ancestor "$frozen" HEAD
          git diff --exit-code "$frozen" HEAD -- "$plan"
          printf 'verified_head=%s\nfrozen_reference=%s\nfrozen_plan=%s\n' "$expected" "$baseline" "$frozen" | tee /tmp/st2-exp-004-closure-provenance.txt

      - name: Prove accepted Q/R/C mathematical controls remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          baseline='50f3031b8d2657cbe0710e73e5935d997d40e49b'
          manifests=(
            LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt
            LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt
            LAB/20_FORMALIZATION/C_STAGE/C_ACCEPTED_INPUTS.txt
          )
          for manifest in "${manifests[@]}"; do
            test -s "$manifest"
            git diff --exit-code "$baseline" HEAD -- "$manifest"
            while IFS= read -r src || [ -n "$src" ]; do
              [ -z "$src" ] && continue
              test -f "$src"
              git diff --exit-code "$baseline" HEAD -- "$src"
            done < "$manifest"
          done

          decision='LAB/10_CONSTRUCTION/decisions/R-DP-003/UNIT.md'
          grep -Fq 'RESOLVED — LOCALIZED CLASSICAL COMPARABILITY SELECTED FOR STAGE I' "$decision"
          grep -Fq 'localized classical witness of CutComparability' "$decision"
          grep -Fq 'RTotality ↔ CutComparability' "$decision"
          grep -Fq 'BOMA-ST2-LEARNING-INTEGRATION-003' "$decision"
          echo ST2_EXP_004_ACCEPTED_CONTROLS_AND_RDP003_SELECTION_UNCHANGED_PASS

      - name: Verify closed lifecycle, integrated lesson, and historical monotonicity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py \
            LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py \
            LAB/00_ARCHITECTURE/tools/stage_two_historical_closure_audit.py
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py --json-out /tmp/011.json
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py --json-out /tmp/004.json
          python3 LAB/00_ARCHITECTURE/tools/stage_two_historical_closure_audit.py --json-out /tmp/historical.json
          python3 LAB/PDSA/tools/autonomous_research_program_audit.py
          grep -Fq 'ST2_EXP_011_LIFECYCLE_CLOSED_PASS' /tmp/011.json
          grep -Fq 'ST2_EXP_004_LIFECYCLE_CLOSED_PASS' /tmp/004.json
          grep -Fq 'BOMA-ST2-LEARNING-INTEGRATION-003' /tmp/004.json
          grep -Fq 'ST2_EXP_001_003_HISTORICAL_CLOSURE_PASS' /tmp/historical.json
          rm -rf LAB/00_ARCHITECTURE/tools/__pycache__ LAB/PDSA/tools/__pycache__
          git diff --exit-code
          git status --porcelain=v1 | test ! -s /dev/stdin
          echo ST2_EXP_004_READ_ONLY_INTEGRATED_CLOSED_STATE_PASS

      - name: Upload closed-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-004-closed-state-${{ github.run_id }}
          path: |
            /tmp/st2-exp-004-closure-provenance.txt
            /tmp/011.json
            /tmp/004.json
            /tmp/historical.json
          if-no-files-found: warn
