name: BOMA R Stage-One Integration 002 — V5

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LAB/payloads/lean/NCore/**'
      - 'LAB/payloads/lean/NArithmetic/**'
      - 'LAB/payloads/lean/ZStage/**'
      - 'LAB/payloads/lean/QStage/**'
      - 'LAB/payloads/lean/RStage/**'
      - 'LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt'
      - '.github/workflows/boma-r-integration-002.yml'
      - 'lean-toolchain'

concurrency:
  group: boma-r-integration-002-evidence-main
  cancel-in-progress: false

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Validate R-J-002 assembly manifest
        id: manifest
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          test -s LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt
          while IFS= read -r src || [ -n "$src" ]; do
            [ -z "$src" ] && continue
            test -f "$src"
          done < LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt

      - name: Verify R-J-002 integrated Stage-One real certificate
        id: integration
        if: steps.setup.outcome == 'success' && steps.manifest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          : > /tmp/RStageIntegration002.lean
          while IFS= read -r src || [ -n "$src" ]; do
            [ -z "$src" ] && continue
            cat "$src" >> /tmp/RStageIntegration002.lean
            printf '\n' >> /tmp/RStageIntegration002.lean
          done < LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt
          lake env lean /tmp/RStageIntegration002.lean

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          RESULT=PASS
          for x in "${{ steps.setup.outcome }}" "${{ steps.manifest.outcome }}" "${{ steps.integration.outcome }}"; do
            if [ "$x" != success ]; then RESULT=FAIL_OR_INCOMPLETE; fi
          done

          git fetch origin main

          # Evidence may be committed on top of a newer documentation-only main head,
          # but never on top of a main head whose verification inputs differ from
          # the source state actually checked by this run.
          if ! git diff --quiet "${GITHUB_SHA}" origin/main -- \
              LAB/payloads/lean/NCore \
              LAB/payloads/lean/NArithmetic \
              LAB/payloads/lean/ZStage \
              LAB/payloads/lean/QStage \
              LAB/payloads/lean/RStage \
              LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt \
              .github/workflows/boma-r-integration-002.yml \
              lean-toolchain; then
            echo "::error::R-J-002 verification inputs changed on main after this run started; refusing to promote stale evidence."
            git diff --name-only "${GITHUB_SHA}" origin/main -- \
              LAB/payloads/lean/NCore \
              LAB/payloads/lean/NArithmetic \
              LAB/payloads/lean/ZStage \
              LAB/payloads/lean/QStage \
              LAB/payloads/lean/RStage \
              LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt \
              .github/workflows/boma-r-integration-002.yml \
              lean-toolchain
            exit 1
          fi

          git checkout -B rstageintegration002-evidence origin/main
          mkdir -p LAB/20_FORMALIZATION/R_STAGE/evidence
          cat > LAB/20_FORMALIZATION/R_STAGE/evidence/R_INTEGRATION_002_V5_LATEST.md <<EOF
          # R-J-002 Stage-One R Integration V5 Evidence
          **Status:** ${RESULT}  
          **Verified commit:** \`${GITHUB_SHA}\`  
          **Workflow run ID:** \`${GITHUB_RUN_ID}\`  
          **Pinned toolchain:** \`$(cat lean-toolchain)\`

          | Target | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | assembly manifest validation | ${{ steps.manifest.outcome }} |
          | same-carrier identity/order/Q embedding/additive group/explicit ordered-field closure/inverse witness/Dedekind LUB/density/Archimedean integration certificate | ${{ steps.integration.outcome }} |
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAB/20_FORMALIZATION/R_STAGE/evidence/R_INTEGRATION_002_V5_LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Record R-J-002 integration V5 run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Enforce
        if: always()
        run: |
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.manifest.outcome }}" = success
          test "${{ steps.integration.outcome }}" = success
