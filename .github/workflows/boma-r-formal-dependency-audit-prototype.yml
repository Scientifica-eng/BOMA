name: BOMA R Formal Dependency Audit — Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/claim-transparency-001
    paths:
      - 'LAB/00_ARCHITECTURE/LEAN_FORMAL_DEPENDENCY_AUDIT_DESIGN.md'
      - 'LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json'
      - 'LAB/00_ARCHITECTURE/tools/LeanDependencyExtractor.lean'
      - 'LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py'
      - 'LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py'
      - 'LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt'
      - 'LAB/payloads/lean/NCore/**'
      - 'LAB/payloads/lean/NArithmetic/**'
      - 'LAB/payloads/lean/ZStage/**'
      - 'LAB/payloads/lean/QStage/**'
      - 'LAB/payloads/lean/RStage/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/boma-r-formal-dependency-audit-prototype.yml'

permissions:
  contents: write

concurrency:
  group: boma-r-formal-dependency-audit-prototype
  cancel-in-progress: false

jobs:
  extract-r-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lean
        id: setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Extract actual R declaration closure and dependency edges
        id: audit
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage R \
            --manifest LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt \
            --target BOMA.R.StageIntegration002.rStageIntegrationCertificate \
            --json-out /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
            > /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout 2>&1
          cat /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout

      - name: Classify external boundary against declared policy
        id: classify
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/00_ARCHITECTURE/tools/formal_dependency_classify.py \
            --closure /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
            --policy LAB/00_ARCHITECTURE/FORMAL_DEPENDENCY_POLICY.json \
            --json-out /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json \
            > /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout 2>&1
          cat /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout

      - name: Record prototype evidence on feature branch
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=PROTOTYPE_PASS
          if [ "${{ steps.setup.outcome }}" != success ] || [ "${{ steps.audit.outcome }}" != success ]; then
            RESULT=PROTOTYPE_FAIL
          fi

          CLASSIFICATION_STATUS=NO_OUTPUT
          if [ -f /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json ]; then
            CLASSIFICATION_STATUS="$(python3 - <<'PY'
          import json
          with open('/tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json', encoding='utf-8') as fh:
              print(json.load(fh).get('status', 'UNKNOWN'))
          PY
          )"
          elif [ "${{ steps.classify.outcome }}" = skipped ]; then
            CLASSIFICATION_STATUS=SKIPPED
          fi

          BRANCH='architecture/claim-transparency-001'
          VERIFIED_SHA="$GITHUB_SHA"
          RUN_ID="$GITHUB_RUN_ID"
          TOOLCHAIN="$(cat lean-toolchain 2>/dev/null || echo UNKNOWN)"

          git fetch origin "$BRANCH"
          CURRENT_HEAD="$(git rev-parse "origin/$BRANCH")"
          if [ "$CURRENT_HEAD" != "$VERIFIED_SHA" ]; then
            echo '::error::Feature branch moved after this audit started; refusing stale prototype evidence promotion.'
            exit 1
          fi

          git checkout -B claim-transparency-evidence "origin/$BRANCH"
          mkdir -p LAB/20_FORMALIZATION/R_STAGE/evidence

          if [ -f /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json ]; then
            cp /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.json \
              LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.json
          else
            cat > LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.json <<EOF
          {
            "status": "PROTOTYPE_FAIL",
            "reason": "dependency extractor did not produce JSON output",
            "verified_commit": "${VERIFIED_SHA}",
            "workflow_run": "${RUN_ID}"
          }
          EOF
          fi

          if [ -f /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json ]; then
            cp /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.json \
              LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE_LATEST.json
          else
            cat > LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE_LATEST.json <<EOF
          {
            "status": "${CLASSIFICATION_STATUS}",
            "reason": "semantic classification did not produce JSON output",
            "verified_commit": "${VERIFIED_SHA}",
            "workflow_run": "${RUN_ID}"
          }
          EOF
          fi

          cat > LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md <<EOF
          # R Formal Dependency Closure — Prototype Evidence

          **Status:** ${RESULT}  
          **Semantic classification:** ${CLASSIFICATION_STATUS}  
          **Audited source commit:** \`${VERIFIED_SHA}\`  
          **Workflow run ID:** \`${RUN_ID}\`  
          **Pinned toolchain:** \`${TOOLCHAIN}\`  
          **Root declaration:** \`BOMA.R.StageIntegration002.rStageIntegrationCertificate\`  
          **Accepted assembly manifest:** \`LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt\`

          | Step | Outcome |
          |---|---|
          | Lean setup | ${{ steps.setup.outcome }} |
          | compile accepted assembly + extract transitive declaration closure/edges | ${{ steps.audit.outcome }} |
          | classify boundary against explicit dependency policy | ${{ steps.classify.outcome }} |

          ## Scope boundary

          A \`PROTOTYPE_PASS\` means the theorem/declaration closure extractor executed successfully. It is **not** by itself a BOMA \`TRANSPARENCY PASS\`.

          The semantic classifier separately compares external leaves and source-attributed direct consumers against \`FORMAL_DEPENDENCY_POLICY.json\`. A classification status of \`CLASSIFICATION_REVIEW_REQUIRED\` is a deliberate research result: its residual dependencies must be diagnosed, declared, or removed before any transparency promotion.
          EOF

          if [ -f /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout ]; then
            {
              echo
              echo '## Classifier log tail'
              echo
              echo '```text'
              tail -n 80 /tmp/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE.stdout
              echo '```'
            } >> LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          elif [ -f /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout ]; then
            {
              echo
              echo '## Extractor log tail'
              echo
              echo '```text'
              tail -n 80 /tmp/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE.stdout
              echo '```'
            } >> LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.json \
            LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLASSIFICATION_PROTOTYPE_LATEST.json \
            LAB/20_FORMALIZATION/R_STAGE/evidence/R_FORMAL_DEPENDENCY_CLOSURE_PROTOTYPE_LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Record R formal dependency prototype run ${RUN_ID}"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Enforce prototype extraction
        if: always()
        shell: bash
        run: |
          set -e
          test "${{ steps.setup.outcome }}" = success
          test "${{ steps.audit.outcome }}" = success
          test "${{ steps.evidence.outcome }}" = success

      - name: Record scope in job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R Formal Dependency Closure Prototype

          This workflow measures transitive Lean declaration dependencies from the accepted R integration certificate using a separately compiled accepted assembly module, retains direct dependency edges, and runs an explicit boundary classifier.

          Extraction success is not a final `TRANSPARENCY PASS`. Any `CLASSIFICATION_REVIEW_REQUIRED` residual must be diagnosed or explicitly classified before promotion.
          EOF
