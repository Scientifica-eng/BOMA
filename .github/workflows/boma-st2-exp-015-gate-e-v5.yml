name: BOMA ST2-EXP-015 Gate E P-Q Reconvergence — V5 Extension

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/stage-two-st2-exp-015-*'
  pull_request:
    branches: [main]

jobs:
  verify-gate-e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Gate-E head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head baseline and immutable Frozen Plan
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git merge-base --is-ancestor 2a6c38af70e596c840ef2db4733421bde38f3ee5 HEAD
          plan=LAB/PDSA/PDSA-ST2-EXP-015_CAUCHY_ROUTE_COMPOSITION_SQUARE.md
          git diff --exit-code 1accee613630ae876b6ca9dcf820737ab89a168c HEAD -- "$plan"
          printf 'expected_head=%s\nverified_head=%s\n' "$expected" "$(git rev-parse HEAD)" | tee /tmp/st2-exp-015-gate-e-provenance.txt

      - name: Verify accepted-source firewall
        shell: bash
        run: |
          set -euo pipefail
          baseline=2a6c38af70e596c840ef2db4733421bde38f3ee5
          for manifest in LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt LAB/20_FORMALIZATION/C_STAGE/C_ACCEPTED_INPUTS.txt; do
            git diff --exit-code "$baseline" HEAD -- "$manifest"
            while IFS= read -r src || [ -n "$src" ]; do
              [ -z "$src" ] && continue
              git diff --exit-code "$baseline" HEAD -- "$src"
            done < "$manifest"
          done

      - name: Validate post-completion manifest separation and firewall
        shell: bash
        run: |
          set -euo pipefail
          field=LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_Q_FIELD_INPUTS.txt
          semantic=LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_Q_SEMANTIC_INPUTS.txt
          compare=LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_PQ_COMPARISON_INPUTS.txt
          source=LAB/payloads/lean/CStage/ST2Exp015CauchyPQReconvergence.lean
          evidence=LAB/PDSA/experiments/ST2-EXP-015_GATE_E_CAUCHY_PQ_RECONVERGENCE_001.md
          for f in "$field" "$semantic" "$compare" "$source" "$evidence"; do test -s "$f"; done
          ! grep -Fq 'ST2Exp015CauchyPQReconvergence.lean' "$field"
          ! grep -Fq 'ST2Exp011CauchyH6Comparison.lean' "$field"
          ! grep -Fq 'ST2Exp015CauchyPQReconvergence.lean' "$semantic"
          test "$(tail -n 1 "$compare")" = 'LAB/payloads/lean/CStage/ST2Exp015CauchyPQReconvergence.lean'
          forbidden='ST2Exp002|ST2Exp003DedekindCauchyFieldIsomorphism|Classical\.choose|(^|[^[:alnum:]_])(sorry|axiom)([^[:alnum:]_]|$)'
          if grep -En "$forbidden" "$source"; then echo 'Gate-E source crossed forbidden boundary' >&2; exit 1; fi
          grep -Fq 'cauchyPQComparison' "$source"
          grep -Fq 'cauchyPQIsomorphism' "$source"
          grep -Fq 'forward_coordinate_formula' "$source"
          grep -Fq 'backward_coordinate_formula' "$source"
          grep -Fq 'pq_preserve_real' "$source"
          grep -Fq 'pq_preserve_i' "$source"
          grep -Fq 'pq_preserve_add' "$source"
          grep -Fq 'pq_preserve_mul' "$source"

      - name: Setup pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Elaborate independent Q then separate P-Q comparison
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/BOMAST2Exp015GateE.lean
          : > "$target"
          for manifest in LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_Q_SEMANTIC_INPUTS.txt LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_PQ_COMPARISON_INPUTS.txt; do
            while IFS= read -r src || [ -n "$src" ]; do
              [ -z "$src" ] && continue
              test -f "$src"
              cat "$src" >> "$target"
              printf '\n' >> "$target"
            done < "$manifest"
          done
          cat >> "$target" <<'EOF'
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.cauchyPQComparison
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.cauchyPQIsomorphism
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.pq_left_inverse
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.pq_right_inverse
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.pq_preserve_real
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.pq_preserve_i
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.pq_preserve_add
          #print axioms BOMA.C.StageTwo.CauchyPQReconvergence015.pq_preserve_mul
          EOF
          lake env lean "$target" 2>&1 | tee /tmp/st2-exp-015-gate-e-lean.log

      - name: Audit declaration closure and selector boundary
        shell: bash
        run: |
          set -euo pipefail
          combined=/tmp/st2-exp-015-gate-e-inputs.txt
          cat LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_Q_SEMANTIC_INPUTS.txt LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_015_CAUCHY_PQ_COMPARISON_INPUTS.txt > "$combined"
          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py --stage C --manifest "$combined" --target BOMA.C.StageTwo.CauchyPQReconvergence015.cauchyPQIsomorphism --json-out /tmp/st2-exp-015-gate-e-closure.json > /tmp/st2-exp-015-gate-e-dependency-audit.log
          if grep -Eq 'Classical\.choose|Classical\.choose_spec' LAB/payloads/lean/CStage/ST2Exp015CauchyPQReconvergence.lean; then exit 1; fi
          cat /tmp/st2-exp-015-gate-e-closure.json

      - name: Run governance and architecture regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/PDSA/tools/autonomous_research_program_audit.py | tee /tmp/st2-exp-015-gate-e-autonomy-audit.txt
          python3 LAB/00_ARCHITECTURE/tools/architecture_consistency_audit.py | tee /tmp/st2-exp-015-gate-e-architecture-audit.txt

      - name: Preserve Gate-E exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-015-gate-e-${{ github.run_id }}
          path: |
            /tmp/st2-exp-015-gate-e-provenance.txt
            /tmp/st2-exp-015-gate-e-lean.log
            /tmp/st2-exp-015-gate-e-dependency-audit.log
            /tmp/st2-exp-015-gate-e-closure.json
            /tmp/st2-exp-015-gate-e-autonomy-audit.txt
            /tmp/st2-exp-015-gate-e-architecture-audit.txt
          if-no-files-found: ignore
