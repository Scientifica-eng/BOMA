name: BOMA ST2-EXP-004 Provenance Repair Renderer

permissions:
  contents: read

on:
  push:
    branches:
      - 'feature/stage-two-st2-exp-004-r-total-order-logical-regime'
    paths:
      - '.github/workflows/boma-st2-exp-004-provenance-repair-renderer.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Render corrected current-state files without mutating branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/st2-exp-004-repair/LAB/PDSA
          mkdir -p /tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools
          mkdir -p /tmp/st2-exp-004-repair/.github/workflows
          python3 - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          baseline = '6779d028c49f73757ea838c163d3968a982559fe'
          ledger_path = Path('LAB/PDSA/STAGE_TWO_BRANCH_ORIGIN_LEDGER_001.json')
          current = json.loads(ledger_path.read_text(encoding='utf-8'))
          historical = json.loads(subprocess.check_output(
              ['git', 'show', f'{baseline}:{ledger_path.as_posix()}'], text=True
          ))

          protected_ids = ['ST2-EXP-001', 'ST2-EXP-002', 'ST2-EXP-003', 'ST2-EXP-011']
          hist_by_id = {r['experiment_id']: r for r in historical['records']}
          cur_by_id = {r['experiment_id']: r for r in current['records']}
          assert set(protected_ids) <= set(hist_by_id)
          assert 'ST2-EXP-004' in cur_by_id

          repaired = copy.deepcopy(historical)
          for key in (
              'status', 'date', 'purpose', 'active_experiment', 'next_experiment_slot',
              'required_next_act', 'allowed_origin_kinds', 'accepted_reference',
              'cross_stage_governance_failure_runs',
          ):
              repaired[key] = copy.deepcopy(current[key])

          rec004 = copy.deepcopy(cur_by_id['ST2-EXP-004'])
          failures = list(rec004.get('failure_records', []))
          for rel in (
              'LAB/PDSA/experiments/ST2-EXP-004_FAILURE_007_CLOSED_STATE_011_AUDIT_BASELINE_UNIT_EXPECTATION.md',
              'LAB/PDSA/experiments/ST2-EXP-004_FAILURE_008_CLOSED_STATE_LEDGER_HISTORICAL_PROVENANCE_REGRESSION.md',
          ):
              if rel not in failures:
                  failures.append(rel)
          rec004['failure_records'] = failures
          rec004['post_study_failure_runs'] = [32837301674, 32837451796, 32837451803]

          repaired['records'] = [copy.deepcopy(hist_by_id[x]) for x in protected_ids] + [rec004]
          repaired_by_id = {r['experiment_id']: r for r in repaired['records']}
          for eid in protected_ids:
              assert repaired_by_id[eid] == hist_by_id[eid], eid
          assert repaired['active_experiment'] is None
          assert repaired_by_id['ST2-EXP-004']['status'].startswith('CLOSED / PASS')

          out_ledger = Path('/tmp/st2-exp-004-repair/LAB/PDSA/STAGE_TWO_BRANCH_ORIGIN_LEDGER_001.json')
          out_ledger.write_text(json.dumps(repaired, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          p011 = Path('LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py')
          s011 = p011.read_text(encoding='utf-8')
          old = '"baseline_producer_unit_id": "C-BLOCK-001",'
          new = '"baseline_producer_unit_id": "C-COMPARE-BLOCK-001",'
          assert s011.count(old) == 1, s011.count(old)
          s011 = s011.replace(old, new, 1)
          Path('/tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py').write_text(s011, encoding='utf-8')

          p004 = Path('LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py')
          s004 = p004.read_text(encoding='utf-8')
          replacements = {
              'for i in range(1, 7)': 'for i in range(1, 9)',
              '("PASS / EXACT F-04 IMPACT CLASSIFIED", "NOT RECOVERED", "RETAIN R-DP-003", "NO NEXT EXPERIMENT")': '("PASS / EXACT F-04 IMPACT CLASSIFIED", "NOT RECOVERED", "RETAIN R-DP-003", "No next experiment is authorized")',
              '''        for rel in (STATUS, REGISTER):\n            text = read(root, rel)\n            for marker in ("ST2-EXP-004", "CLOSED", "PASS", "ACTIVE", "NONE", "NO_ACTIVE_PROGRAM", "INTEGRATION"):\n                if marker not in text:\n                    add(residuals, "current_state_marker_missing", document=rel, marker=marker)\n            if "GATE B NEXT" in text or "ST2-EXP-004 ACTIVE / PLAN FROZEN" in text:\n                add(residuals, "stale_active_004_marker", document=rel)''': '''        state_markers = {\n            STATUS: ("ST2-EXP-004", "CLOSED", "PASS", "ACTIVE", "NONE", "NO_ACTIVE_PROGRAM", "INTEGRATION"),\n            REGISTER: ("ST2-EXP-004", "CLOSED", "PASS", "ACTIVE", "NONE", "INTEGRATION", "NEXT EXPERIMENT: NOT AUTHORIZED"),\n        }\n        for rel, markers in state_markers.items():\n            text = read(root, rel)\n            for marker in markers:\n                if marker not in text:\n                    add(residuals, "current_state_marker_missing", document=rel, marker=marker)\n            if "GATE B NEXT" in text or "ST2-EXP-004 ACTIVE / PLAN FROZEN" in text:\n                add(residuals, "stale_active_004_marker", document=rel)''',
          }
          for old_text, new_text in replacements.items():
              assert old_text in s004, old_text
              s004 = s004.replace(old_text, new_text, 1)
          Path('/tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py').write_text(s004, encoding='utf-8')

          status = Path('LAB/PDSA/STATUS.md').read_text(encoding='utf-8')
          old_status = '`ST2-EXP-004` preserves six execution failure records under'
          assert old_status in status
          status = status.replace(old_status, '`ST2-EXP-004` preserves eight execution failure records under', 1)
          Path('/tmp/st2-exp-004-repair/LAB/PDSA/STATUS.md').write_text(status, encoding='utf-8')

          register = Path('LAB/PDSA/STAGE_TWO_BRANCH_EXPERIMENT_REGISTER_001.md').read_text(encoding='utf-8')
          old_register = 'Failure records `ST2-EXP-004_FAILURE_001` through `006` remain preserved as'
          assert old_register in register
          register = register.replace(old_register, 'Failure records `ST2-EXP-004_FAILURE_001` through `008` remain preserved as', 1)
          Path('/tmp/st2-exp-004-repair/LAB/PDSA/STAGE_TWO_BRANCH_EXPERIMENT_REGISTER_001.md').write_text(register, encoding='utf-8')

          gate_a = Path('.github/workflows/boma-st2-exp-004-r-total-order-logical-regime.yml').read_text(encoding='utf-8')
          old_gate = '''          assert d["active_experiment"] == "ST2-EXP-004", d["active_experiment"]\n          records = [r for r in d["records"] if r["experiment_id"] == "ST2-EXP-004"]\n          assert len(records) == 1\n          r = records[0]\n          assert r["origin_kind"] == "DECISION_POINT"\n          assert r["origin_id"] == "R-DP-003"\n          assert r["frozen_plan_commit"] == "89c9dc9154e7ca469e5c94c177be223205ee9dbd"\n          print("ST2_EXP_004_GATE0_ACTIVE_PASS")'''
          new_gate = '''          records = [r for r in d["records"] if r["experiment_id"] == "ST2-EXP-004"]\n          assert len(records) == 1\n          r = records[0]\n          assert r["origin_kind"] == "DECISION_POINT"\n          assert r["origin_id"] == "R-DP-003"\n          assert r["frozen_plan_commit"] == "89c9dc9154e7ca469e5c94c177be223205ee9dbd"\n          if d["active_experiment"] == "ST2-EXP-004":\n              assert str(r["status"]).startswith("ACTIVE / PLAN FROZEN")\n              print("ST2_EXP_004_GATE0_ACTIVE_PASS")\n          else:\n              assert d["active_experiment"] is None\n              assert str(r["status"]).startswith("CLOSED / PASS")\n              print("ST2_EXP_004_LIFECYCLE_CLOSED_GATE_REPLAY_PASS")'''
          assert old_gate in gate_a
          gate_a = gate_a.replace(old_gate, new_gate, 1)
          Path('/tmp/st2-exp-004-repair/.github/workflows/boma-st2-exp-004-r-total-order-logical-regime.yml').write_text(gate_a, encoding='utf-8')
          PY

      - name: Verify rendered repair against current repository
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/st2-exp-004-repair/LAB/PDSA/STAGE_TWO_BRANCH_ORIGIN_LEDGER_001.json LAB/PDSA/STAGE_TWO_BRANCH_ORIGIN_LEDGER_001.json
          cp /tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py
          cp /tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py
          cp /tmp/st2-exp-004-repair/LAB/PDSA/STATUS.md LAB/PDSA/STATUS.md
          cp /tmp/st2-exp-004-repair/LAB/PDSA/STAGE_TWO_BRANCH_EXPERIMENT_REGISTER_001.md LAB/PDSA/STAGE_TWO_BRANCH_EXPERIMENT_REGISTER_001.md
          cp /tmp/st2-exp-004-repair/.github/workflows/boma-st2-exp-004-r-total-order-logical-regime.yml .github/workflows/boma-st2-exp-004-r-total-order-logical-regime.yml
          python3 -m py_compile \
            LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py \
            LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py \
            LAB/00_ARCHITECTURE/tools/stage_two_historical_closure_audit.py
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py --json-out /tmp/st2-exp-011-repaired.json
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py --json-out /tmp/st2-exp-004-repaired.json
          python3 LAB/00_ARCHITECTURE/tools/stage_two_historical_closure_audit.py --json-out /tmp/st2-exp-historical-repaired.json
          grep -Fq 'ST2_EXP_011_LIFECYCLE_CLOSED_PASS' /tmp/st2-exp-011-repaired.json
          grep -Fq 'ST2_EXP_004_LIFECYCLE_CLOSED_PASS' /tmp/st2-exp-004-repaired.json
          grep -Fq 'ST2_EXP_001_003_HISTORICAL_CLOSURE_PASS' /tmp/st2-exp-historical-repaired.json
          sha256sum \
            /tmp/st2-exp-004-repair/LAB/PDSA/STAGE_TWO_BRANCH_ORIGIN_LEDGER_001.json \
            /tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools/st2_exp_011_lifecycle_closure_audit.py \
            /tmp/st2-exp-004-repair/LAB/00_ARCHITECTURE/tools/st2_exp_004_lifecycle_closure_audit.py \
            /tmp/st2-exp-004-repair/LAB/PDSA/STATUS.md \
            /tmp/st2-exp-004-repair/LAB/PDSA/STAGE_TWO_BRANCH_EXPERIMENT_REGISTER_001.md \
            /tmp/st2-exp-004-repair/.github/workflows/boma-st2-exp-004-r-total-order-logical-regime.yml \
            > /tmp/st2-exp-004-repair/SHA256SUMS
          cp /tmp/st2-exp-011-repaired.json /tmp/st2-exp-004-repair/
          cp /tmp/st2-exp-004-repaired.json /tmp/st2-exp-004-repair/
          cp /tmp/st2-exp-historical-repaired.json /tmp/st2-exp-004-repair/

      - name: Upload rendered repair
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-004-provenance-repair-${{ github.run_id }}
          path: /tmp/st2-exp-004-repair
          if-no-files-found: error
